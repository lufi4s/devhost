# Reverse proxy: routes /api to the backend (Laravel API) and everything
# else to the frontend (Next.js).
#
# NOTE: upstream "server" blocks resolve Docker Compose service names only
# ONCE at nginx startup via /etc/hosts. Compose uses its embedded DNS
# (127.0.0.11) for service discovery, and container IPs change on restart,
# so static upstreams go stale and return a 502. Instead we use a
# `resolver` + per-request variables so the name is re-resolved on every
# request.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
